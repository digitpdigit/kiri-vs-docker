services:
  app:
    build:
      context: ../app
    image: kiri-vs-docker-app:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      APP_VERSION: ${APP_VERSION:-dev}
      DB_CONNECT_RETRIES: "0"
    mem_limit: ${APP_MEMORY:-256M}
    cpus: ${APP_CPUS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    # Tag as used in the runs; resolved digest is recorded in env/versions.md.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Tag as used in the runs; resolved digest is recorded in env/versions.md.
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEMORY:-128M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
